name: dependabot-automerge

# Enables auto-merge on Dependabot PRs. GitHub merges them once the required
# status checks of the ruleset on the default branch pass (the "build" check);
# if that ruleset is removed, `--auto` would merge immediately.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
