meta:
  version: "1.0.0-test"
  name: test_clustering_rules
  generated_at: "2026-07-24"

synonyms:
  - phrase: "agrees to a deal"
    canonical: "sign"
  - phrase: "multi-year extension"
    canonical: "extend"
  - phrase: "did not report"
    canonical: "practice"

event_rules:
  action_terms:
    sign: ["sign", "signs", "signed", "agreed to terms"]
    release: ["release", "released", "cut"]
    trade: ["trade", "traded"]
    waive: ["waive", "waived"]
    claim: ["claimed off waivers"]
    extend: ["extend", "extends", "extension"]
    injure: ["injured", "torn"]
    return: ["returns to practice"]
    practice: ["practice", "practices", "dnp"]
    activate: ["activated"]
    draft: ["drafted", "draft pick"]
    preview: ["preview", "how to watch"]
    result: ["final score", "recap"]
    quote: ["said", "press conference"]
    report: ["reportedly", "sources say"]
    confirm: ["confirmed", "officially"]
    correct: ["correction:", "walks back"]
  content_cues:
    rumor: ["reportedly", "expected to"]
    confirmation: ["confirmed", "officially"]
    correction: ["correction:", "walks back"]
    analysis: ["analysis", "breakdown"]
    reaction: ["reacts", "fans react"]
    quote: ["said", "press conference"]
  date_window_policy:
    default_window: "24h"

field_weights:
  title: 1.0
  description: 0.7
  body: 0.3

topic_groups:
  transaction: [sign, extend]
  injury: [injure]

injury_types:
  knee: ["knee", "knee injury"]
  ankle: ["ankle", "ankle sprain"]

unknown_entity_stoplist:
  - "Example Bowl"
  - "All Star Game"

# "generic" is intentionally omitted here to exercise
# event_rules.date_window_policy.default_window as a fallback.
temporal_windows:
  transaction: "48h"
  injury: "72h"
  draft: "240h"
  game: "24h"
  practice: "24h"
  quote: "12h"
  rumor: "24h"
  confirmation: "24h"
  correction: "24h"
  analysis: "48h"
  reaction: "12h"

thresholds:
  join_threshold: 0.72
  join_margin: 0.08
  ambiguous_low: 0.45
  ambiguous_high: 0.60
  substantial_update_threshold: 0.55
  representative_switch_margin: 0.10

weights:
  entity_match: 0.35
  action_match: 0.20
  event_type_match: 0.15
  opponent_match: 0.10
  date_window_match: 0.05
  source_priority: 0.10
  novelty: 0.05
  primary_source: 0.30
  completeness: 0.20
  clickbait_penalty: -0.15

domain_priorities:
  isotopes.example.com: 100
  news.example.org: 85
  blog.example.net: 60

content_type_rules:
  hard_news:
    window_hours: 24
    publish_limit: 1
    allow_updates: true
  social_posts:
    window_hours: 6
    publish_limit: 0
    allow_updates: false
  videos:
    window_hours: 48
    publish_limit: 1
    allow_updates: false
  analysis:
    window_hours: 24
    publish_limit: 1
    allow_updates: false
  reactions:
    window_hours: 6
    publish_limit: 0
    allow_updates: false
