# Example event-clustering rules for the fictional "Springfield Isotopes"
# deployment. Every domain is under example.com / example.org. Copy this
# file and tune it for a real deployment.
meta:
  version: "0.1.0-example"
  name: example_event_clustering_rules
  generated_at: "2026-10-01"

# The event vocabulary. Each list's order is its detection priority.
# event_types: what an article can be about; flags (referential,
#   update_framing, team_level_needs_opponent) and member_role (correction,
#   confirmation, analysis, reaction) drive clustering behaviour.
# actions: map each action_terms bucket to an event type; body_fallback ranks
#   the actions also detected from body text (lower first).
# content_signals: map each content_cues bucket to an event type; a
#   before_action signal wins over the action, an after_action one only
#   applies when no action matched.
taxonomy:
  event_types:
    - {name: transaction, description: "A roster move: signing, release, trade, waiver, claim, extension, contract or practice-squad change."}
    - {name: injury, description: "A player's injury, injury-list move, return, activation or game status."}
    - {name: draft, description: "A draft pick or draft-related news."}
    - {name: game, description: "A game preview or result.", flags: [team_level_needs_opponent]}
    - {name: practice, description: "Practice participation, tryouts or depth chart changes."}
    - {name: quote, description: "Coverage built around what someone said.", flags: [referential]}
    - {name: rumor, description: "An unconfirmed report or speculation.", flags: [referential]}
    - {name: confirmation, description: "Confirmation of an earlier report.", flags: [referential, update_framing], member_role: confirmation}
    - {name: correction, description: "A correction or walk-back of an earlier report.", flags: [referential, update_framing], member_role: correction}
    - {name: analysis, description: "Analysis, predictions or breakdowns rather than news.", flags: [referential], member_role: analysis}
    - {name: reaction, description: "Reactions to an event rather than the event itself.", flags: [referential], member_role: reaction}
  actions:
    - {name: practice-squad, event_type: transaction, body_fallback: 2}
    - {name: demotion, event_type: transaction, body_fallback: 4}
    - {name: sign, event_type: transaction, body_fallback: 10}
    - {name: release, event_type: transaction, body_fallback: 8}
    - {name: trade, event_type: transaction, body_fallback: 9}
    - {name: waive, event_type: transaction, body_fallback: 6}
    - {name: claim, event_type: transaction, body_fallback: 7}
    - {name: extend, event_type: transaction}
    - {name: contract, event_type: transaction}
    - {name: injured-reserve, event_type: injury, body_fallback: 1}
    - {name: injure, event_type: injury, body_fallback: 12}
    - {name: return, event_type: injury}
    - {name: practice, event_type: practice}
    - {name: activate, event_type: injury, body_fallback: 5}
    - {name: promotion, event_type: transaction, body_fallback: 3}
    - {name: roster, event_type: transaction, body_fallback: 11}
    - {name: depth-chart, event_type: practice}
    - {name: tryout, event_type: practice}
    - {name: game-status, event_type: injury}
    - {name: draft, event_type: draft}
    - {name: preview, event_type: game}
    - {name: result, event_type: game}
    - {name: quote, event_type: quote}
    - {name: report, event_type: rumor}
    - {name: confirm, event_type: confirmation}
    - {name: correct, event_type: correction}
  content_signals:
    - {name: correction, event_type: correction, precedence: before_action}
    - {name: confirmation, event_type: confirmation, precedence: before_action}
    - {name: rumor, event_type: rumor, precedence: before_action, flags: [speculative]}
    - {name: analysis, event_type: analysis, precedence: after_action}
    - {name: reaction, event_type: reaction, precedence: after_action}
    - {name: quote, event_type: quote, precedence: after_action}

# Phrases rewritten to a canonical action term before action matching.
synonyms:
  - phrase: "agrees to a deal"
    canonical: "sign"
  - phrase: "multi-year extension"
    canonical: "extend"
  - phrase: "did not report"
    canonical: "practice"

event_rules:
  action_terms:
    sign: ["sign", "signs", "signed", "agreed to terms"]
    release: ["release", "released", "releases", "cut", "cuts"]
    trade: ["trade", "traded", "trades"]
    waive: ["waive", "waived", "waives"]
    claim: ["claimed off waivers", "claims off waivers"]
    extend: ["extend", "extends", "extended", "extension"]
    injured-reserve: ["placed on injured reserve", "goes to injured reserve"]
    injure: ["injured", "injury", "torn", "sprained"]
    practice-squad: ["practice squad"]
    promotion: ["promoted to the active roster"]
    demotion: ["moved to the practice squad"]
    contract: ["contract situation", "new contract terms"]
    game-status: ["questionable", "doubtful", "ruled out"]
    depth-chart: ["depth chart", "starting lineup"]
    roster: ["final roster", "roster cuts"]
    tryout: ["tryout"]
    return: ["returns to practice", "returned to practice", "back at practice"]
    practice: ["practice", "practices", "practiced", "limited practice", "dnp"]
    activate: ["activated", "activates"]
    draft: ["drafted", "drafts", "draft pick"]
    preview: ["preview", "previews", "how to watch"]
    result: ["final score", "recap", "postgame"]
    quote: ["said", "says", "told reporters", "press conference"]
    report: ["reportedly", "sources say", "is expected to"]
    confirm: ["confirmed", "confirms", "officially"]
    correct: ["correction", "clarification", "walks back"]
  content_cues:
    rumor: ["reportedly", "expected to", "linked to"]
    confirmation: ["confirmed", "makes it official"]
    correction: ["correction:", "walks back"]
    analysis: ["analysis", "breakdown", "takeaways"]
    reaction: ["reacts", "fans react"]
    quote: ["said", "told reporters", "press conference"]
  date_window_policy:
    default_window: "24h"

temporal_windows:
  transaction: "48h"
  injury: "72h"
  draft: "240h"
  game: "24h"
  practice: "24h"
  quote: "12h"
  rumor: "24h"
  confirmation: "24h"
  correction: "24h"
  analysis: "48h"
  reaction: "12h"

thresholds:
  join_threshold: 0.72
  join_margin: 0.08
  ambiguous_low: 0.45
  ambiguous_high: 0.60
  substantial_update_threshold: 0.55
  representative_switch_margin: 0.10

weights:
  entity_match: 0.35
  action_match: 0.20
  event_type_match: 0.15
  opponent_match: 0.10
  date_window_match: 0.05
  source_priority: 0.10
  novelty: 0.05
  primary_source: 0.30
  completeness: 0.20
  clickbait_penalty: -0.15

domain_priorities:
  isotopes.example.com: 100
  news.example.org: 80
  blog.example.net: 50

content_type_rules:
  hard_news:
    window_hours: 24
    publish_limit: 1
    allow_updates: true
  social_posts:
    window_hours: 6
    publish_limit: 0
    allow_updates: false
  videos:
    window_hours: 48
    publish_limit: 1
    allow_updates: false
  analysis:
    window_hours: 24
    publish_limit: 1
    allow_updates: false
  reactions:
    window_hours: 6
    publish_limit: 0
    allow_updates: false

field_weights:
  title: 1.0
  description: 0.7
  body: 0.3

topic_groups:
  transaction: [sign, release, trade, waive, claim, extend, contract, "practice-squad", promotion, demotion, roster, "injured-reserve"]
  injury: [injure, "injured-reserve", return, activate, "game-status"]
  draft: [draft]
  practice: [practice, tryout]

injury_types:
  knee: ["knee", "knee injury"]
  ankle: ["ankle", "ankle sprain"]
  hamstring: ["hamstring", "hamstring strain"]

unknown_entity_stoplist:
  - "Example Bowl"
  - "All Star Game"
